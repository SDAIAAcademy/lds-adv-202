<section>
<h2>اليوم 1: من النموذج إلى ملف الدرجات</h2>
<ol>
<li><p>جامعة افتراضية طلب رئيسها تقييمًا لنضج البيانات يشمل بيانات البحث. اقترح زميلك اعتماد نموذج ملزم لإدارة البيانات وحده لأنه ملزم، وهو لا يذكر بيانات البحث. ما ردك؟</p><ul><li><b>أ.</b> أعتمده أساسًا، وأضيف بُعد بيانات البحث من نموذج آخر</li><li><b>ب.</b> أعتمده كما هو، فالنموذج الملزم يغطي كل ما سأل عنه رئيس الجامعة</li><li><b>ج.</b> أستبدله بنموذج دولي أشهر منه وأكثر استخدامًا في الجامعات المماثلة</li><li><b>د.</b> أحوّل مواصفاته إلى قائمة تحقق بنعم أو لا لكل إدارة في الجامعة</li></ul></li>
<li><p>في مقابلة مع مدير المستودعات في شركة توزيع افتراضية قال: «جودة بيانات المخزون ممتازة، نحن في المستوى 4.» ما خطوتك التالية؟</p><ul><li><b>أ.</b> أسجّل المستوى 4 كما قال، لأنه صاحب الإدارة والأعلم بها</li><li><b>ب.</b> أخفّض الدرجة سلفًا لأن المديرين يبالغون</li><li><b>ج.</b> أسأل عن آخر خطأ اكتُشف ومن صحّحه، وأطلب رؤية القياس</li><li><b>د.</b> أنتقل إلى السؤال التالي وأتحقق من قوله لاحقًا في الاستبانة</li></ul></li>
<li><p>تقيّم جودة البيانات في صندوق إقراض افتراضي. أي هذه الوثائق أقوى دليل على أن الجودة تُدار فعلًا؟</p><ul><li><b>أ.</b> سياسة جودة البيانات المعتمدة من مجلس الإدارة</li><li><b>ب.</b> تقارير القياس الشهرية للسنة الأخيرة، مع ما صُحّح</li><li><b>ج.</b> عرض قُدّم لمجلس الإدارة يقول إن دقة البيانات بلغت 98%</li><li><b>د.</b> دعوة الموظفين إلى ورشة «أسبوع الجودة»</li></ul></li>
<li><p>في استبانة هيئة صحية افتراضية أجاب أربعة موظفين من وحدة الابتكار، ومتوسطهم في بند الذكاء الاصطناعي 4.5 من 5، وهو الأعلى. ماذا تكتب في التقرير؟</p><ul><li><b>أ.</b> أن وحدة الابتكار الأعلى ثقة في الذكاء الاصطناعي</li><li><b>ب.</b> أدمج الوحدة في إدارة أخرى دون ذكر ذلك</li><li><b>ج.</b> أذكر متوسطها مع تنبيه إلى صغر العينة</li><li><b>د.</b> «أقل من 5» مكان أرقامها، ولا أذكرها في أي جملة من التقرير</li></ul></li>
<li><p>في تقييم صندوق إقراض افتراضي منحتَ بُعد الحماية 2، ومنحه زميلك 4 لأن قائمة الامتثال تقول 90%. لا جولة ولا سجل تشغيل. كيف تحسمان؟</p><ul><li><b>أ.</b> نأخذ المتوسط بين الدرجتين، أي 3، ونرفع الثقة لأننا اتفقنا عليه</li><li><b>ب.</b> يقرر أقدمنا خبرة في التقييم، ونكتب درجته</li><li><b>ج.</b> نطبّق قاعدة الوجود بلا تشغيل: 2، ونكتب السجل الذي يرفعها</li><li><b>د.</b> نعتمد 4 لأن نسبة 90% رقم مكتوب في وثيقة</li></ul></li>
<li><p>مستشفى جامعي افتراضي يريد تقييمًا يجيب عن سؤالين: هل بياناتنا موثوقة؟ وهل نحن مستعدون لنماذج التشخيص المساعد؟ أي اختيار للنموذج أنسب؟</p><ul><li><b>أ.</b> نموذج لإدارة البيانات وحده، لأن البيانات أساس كل ما سواه في المستشفى</li><li><b>ب.</b> نموذج لإدارة البيانات، مع أبعاد للتطبيقات والأثر من إطار للتبني</li><li><b>ج.</b> إطار تبني الذكاء الاصطناعي وحده، لأنه يتضمن البيانات ممكِّنًا</li><li><b>د.</b> قائمة المواصفات الوطنية بنعم أو لا، لأنها ملزمة للمستشفى</li></ul></li>
<li><p>وجدت نموذج نضج منشورًا بأوصاف مستويات ممتازة، وترخيصه يمنع الاستخدام التجاري ويُلزم بنشر المعدَّل بالترخيص نفسه. شركتك الاستشارية تريد إدراجه في دليلها المدفوع. ماذا تفعل؟</p><ul><li><b>أ.</b> أنقل الأوصاف كما هي وأذكر المصدر ورابطه في حاشية كل صفحة من الدليل</li><li><b>ب.</b> أترجم الأوصاف إلى العربية، فالترجمة عمل جديد لا يخضع للترخيص</li><li><b>ج.</b> أستشهد ببنيته ورابطه، وأكتب الأوصاف بصياغتي</li><li><b>د.</b> أستخدمه ما دام الدليل داخليًا ولن يُنشر خارج الشركة</li></ul></li>
<li><p>تكتب بنود استبانة لبُعد جودة البيانات في هيئة نقل افتراضية. أي بند يصلح دليلًا على الممارسة؟</p><ul><li><b>أ.</b> الهيئة تولي جودة البيانات اهتمامًا كبيرًا في عملها</li><li><b>ب.</b> أنا راضٍ عن جودة البيانات المتاحة لي في عملي اليومي في الهيئة</li><li><b>ج.</b> الجودة مسؤولية الجميع في الهيئة وليست مسؤولية فرد</li><li><b>د.</b> في الشهر الماضي أبلغتُ عن خطأ في البيانات وعرفتُ لمن أبلغ</li></ul></li>
<li><p>في خطة أدلة لصندوق تنمية افتراضي، لبُعد القدرات البشرية ثلاثة أسئلة مقابلات مع مدير الموارد البشرية ولا شيء غيرها. ما المشكلة؟</p><ul><li><b>أ.</b> لن يحصل البُعد على ثقة عالية، لأن مصادره من نوع واحد</li><li><b>ب.</b> ثلاثة أسئلة كثيرة لبُعد واحد في مقابلة قصيرة</li><li><b>ج.</b> مدير الموارد البشرية ليس الشخص المناسب لهذا البُعد</li><li><b>د.</b> لا مشكلة إذا كانت إجاباته مفصلة وصادقة ومرتبة بحسب الأبعاد</li></ul></li>
<li><p>في مقابلة قالت مديرة المشتريات في بلدية افتراضية: «بيانات الموردين محدّثة دائمًا». سألتها عن آخر تحديث فقالت إنها لا تعرف التاريخ. كيف تدوّن ذلك؟</p><ul><li><b>أ.</b> بيانات الموردين محدّثة؛ لا حاجة لطلب دليل إضافي</li><li><b>ب.</b> [قال] «محدّثة دائمًا»، و[قال] لا يُعرف تاريخ التحديث؛ أطلب سجله</li><li><b>ج.</b> المديرة غير دقيقة في إجاباتها عن البيانات، ولا يُعتمد على أقوالها</li><li><b>د.</b> [عرض] بيانات الموردين محدّثة بحسب المديرة</li></ul></li>
<li><p>في جهة افتراضية، سياسة حوكمة البيانات مسودة منذ سنة، واللجنة لم تجتمع، وكل الإدارات تقول إن الحوكمة «ممتازة». أي درجة يسندها الدليل على مقياس المقرر؟</p><ul><li><b>أ.</b> 4، لأن الإدارات كلها متفقة على أن الحوكمة ممتازة</li><li><b>ب.</b> 3، لأن هناك سياسة ولجنة على الورق على الأقل</li><li><b>ج.</b> 2 على الأكثر، لأن السياسة مسودة واللجنة لم تجتمع مرة واحدة</li><li><b>د.</b> 0، لأن الإدارات تبالغ فلا يُعتد بأي شيء</li></ul></li>
<li><p>قائمة امتثال داخلية في هيئة افتراضية تؤشر على 92% من المواصفات «مطبقة»، ونصفها بلا دليل مرفق، ولا سجل مراجعة للتصنيف. ما الذي تقوله هذه القائمة عن نضج الحماية؟</p><ul><li><b>أ.</b> أن السياسات موجودة، لا أنها تعمل؛ والنضج يحتاج سجل تشغيل</li><li><b>ب.</b> أن الحماية في المستوى 4 أو أعلى</li><li><b>ج.</b> لا شيء، فالقائمة الداخلية لا قيمة لها في أي تقييم للنضج إطلاقًا</li><li><b>د.</b> أن الحماية ناضجة في نصف المواصفات فقط</li></ul></li>
<li><p>كل الأدلة في بُعد الذكاء الاصطناعي لجهة افتراضية تتفق: لا استخدام في التشغيل، والتجربة الوحيدة انتهت بلا مالك، والاستبانة تؤكد. ما الدرجة والثقة؟</p><ul><li><b>أ.</b> درجة منخفضة، وثقة منخفضة لأن البُعد ضعيف</li><li><b>ب.</b> درجة منخفضة، وثقة عالية لأن الأدلة من ثلاثة أنواع تتفق كلها على الضعف</li><li><b>ج.</b> درجة متوسطة، وثقة متوسطة لأن هناك تجربة واحدة على الأقل انتهت</li><li><b>د.</b> لا درجة، لأن البُعد لم يبدأ بعد في الجهة</li></ul></li>
<li><p>في استبانة جامعة افتراضية أجاب ثلاثة من وحدة البحث، ومتوسطهم في بُعد الثقافة الأدنى بين الوحدات. مدير الوحدة يطلب رؤية النتيجة. ماذا تفعل؟</p><ul><li><b>أ.</b> أعطيه النتيجة لأنه مدير الوحدة وصاحب الحق فيها</li><li><b>ب.</b> أدمج الوحدة مع وحدة أخرى بصمت وأعرض النتيجة المدمجة</li><li><b>ج.</b> أكتب «أقل من 5» مكان نتيجتها، وأشرح له قاعدة الحجب</li><li><b>د.</b> أعرض النتيجة بلا اسم الوحدة لأن الجامعة كبيرة</li></ul></li>
<li><p>أعاد نموذج مستضاف تجميعًا لملاحظات مرمّزة، وفيه: «يرى الموظفون أن الإدارة العليا لا تهتم بالبيانات» دون رقم ملاحظة. ما الصحيح؟</p><ul><li><b>أ.</b> أبقيه لأن الجملة تبدو منسجمة مع ما سمعته في المقابلات</li><li><b>ب.</b> أطلب من النموذج إضافة رقم ملاحظة مناسب ثم أبقيه</li><li><b>ج.</b> أبقيه مع تنبيه «يحتاج تحققًا» في الحاشية</li><li><b>د.</b> أحذفه، فكل ادعاء مجمَّع يستشهد بملاحظة أو يُحذف</li></ul></li>
<li><p>معياركم للمعايرة: «المقيّمان متفقان إذا وقعت درجتاهما ضمن مستوى واحد». كل الدرجات المرجعية بين 1 و3. لماذا لا يكفي هذا المعيار وحده؟</p><ul><li><b>أ.</b> لأن المقيّمين يختلفان دائمًا ولو قرآ الأدلة نفسها بالقواعد نفسها</li><li><b>ب.</b> لأن من يقول 2 لكل بُعد يقع ضمن مستوى من كل المراجع</li><li><b>ج.</b> لأن المستوى الواحد فرق كبير على مقياس من ستة</li><li><b>د.</b> لأن المعايرة يجب أن تكون بالمتوسط بين الدرجتين</li></ul></li>
</ol>
</section>
<section>
<h2>اليوم 2: من الفجوات إلى قرار الراعي</h2>
<ol>
<li><p>في مؤسسة تدريب افتراضية سياسة تصنيف معتمدة منذ عامين، ولا سجل تصنيف، والاستبانة تقول إن 70% لا يعرفون مستويات التصنيف. ما الدرجة والثقة؟</p><ul><li><b>أ.</b> 3 بثقة متوسطة، لأن السياسة معتمدة رسميًا</li><li><b>ب.</b> 2 بثقة عالية، فالوثيقة وغياب السجل والاستبانة تتفق</li><li><b>ج.</b> 2 بثقة منخفضة، لأن الدرجة نفسها منخفضة</li><li><b>د.</b> 0 بثقة عالية، لأنه لا تصنيف فعليًا في أي إدارة</li></ul></li>
<li><p>بلدية افتراضية هدفها إصدار الرخص في يومين بدل عشرة. بُعد الذكاء الاصطناعي اليوم 1، والرئيس يريده 5. ما المستهدف الأنسب لهذا البُعد؟</p><ul><li><b>أ.</b> 5، لأن الرئيس طلبه وهو من يملك الميزانية</li><li><b>ب.</b> 4، كبقية الأبعاد، حتى يتوازن ملف الجهة</li><li><b>ج.</b> لا مستهدف، فالاستراتيجية لا تذكر الذكاء الاصطناعي صراحة</li><li><b>د.</b> 3: استخدام واحد يعمل ويخدم هدف اليومين، بعد ما يسبقه</li></ul></li>
<li><p>في خارطة طريق لهيئة افتراضية، يعتمد «إطلاق المساعد الآلي» على «تصنيف بيانات المستفيدين» الموضوع في الأفق الثاني. الرئيس يريد المساعد في الأفق الأول. ماذا تفعل؟</p><ul><li><b>أ.</b> أضع المساعد في الأفق الثالث، وأعرض على الرئيس ما يقرّبه</li><li><b>ب.</b> أضعه في الأفق الأول كما طلب، وأبدأ التصنيف معه بالتوازي في الأفق نفسه</li><li><b>ج.</b> أحذف التبعية من الخطة لأن الرئيس صاحب القرار الأخير</li><li><b>د.</b> أطلب ميزانية إضافية للأفق الأول تكفي المبادرتين معًا</li></ul></li>
<li><p>لديك 8 دقائق مع رئيس جامعة افتراضية. أي هذه الجمل تفتتح بها الإحاطة؟</p><ul><li><b>أ.</b> «قابلنا 12 شخصًا وراجعنا 40 وثيقة على مدى ثلاثة أسابيع»</li><li><b>ب.</b> «نشكركم على الثقة، ويسعدنا أن نعرض نتائج التقييم»</li><li><b>ج.</b> «بيانات البحث أضعف أبعادنا، ونطلب ثلاثة قرارات اليوم»</li><li><b>د.</b> «متوسط نضجنا 2.4 من 5، وهو قريب من المتوسط»</li></ul></li>
<li><p>استراتيجية مستشفى افتراضي تطلب خفض مدة الانتظار في الطوارئ، ولا تذكر الذكاء الاصطناعي. الرئيس يريد المستوى 5 في الذكاء الاصطناعي. ما المستهدف الذي تقترحه لهذا البُعد؟</p><ul><li><b>أ.</b> 5، لأن الراعي طلبه صراحة وهو صاحب القرار الأخير في المستشفى</li><li><b>ب.</b> مستوى يكفي استخدامًا واحدًا يخدم هدف الانتظار، مع مبرره</li><li><b>ج.</b> لا مستهدف، لأن الاستراتيجية لا تذكر الذكاء الاصطناعي</li><li><b>د.</b> المستوى نفسه في كل الأبعاد حتى تتوازن خارطة الطريق</li></ul></li>
<li><p>بُعد المنصات في جهة افتراضية في المستوى 3، والمستهدف من الاستراتيجية 3. ماذا يكتب سجل الفجوات؟</p><ul><li><b>أ.</b> فجوة صفر مع ما يلزم للحفاظ على المستوى وتعميمه</li><li><b>ب.</b> يحذف البُعد من السجل لأنه لا يحتاج شيئًا</li><li><b>ج.</b> يرفع المستهدف إلى 4 حتى يكون للبُعد مبادرة في خارطة الطريق</li><li><b>د.</b> يخفض أولوية كل الأبعاد الأخرى ليتوازن السجل</li></ul></li>
<li><p>مبادرة «إطلاق مساعد آلي للمستفيدين» تعتمد على «تصنيف بيانات المستفيدين» و«توحيد فئات الطلبات». الراعي يريدها في الأشهر الستة الأولى، والمبادرتان الأخريان لم تبدآ. أين تضعها؟</p><ul><li><b>أ.</b> في الأفق الأول كما طلب الراعي، مع بدء التصنيف بالتوازي</li><li><b>ب.</b> في الأفق الأول، وتؤجَّل المبادرتان إلى ما بعد الإطلاق</li><li><b>ج.</b> في أفق بعد الأفق الذي ينتهي فيه التصنيف وتوحيد فئات الطلبات</li><li><b>د.</b> خارج خارطة الطريق، فالذكاء الاصطناعي ليس أولوية</li></ul></li>
<li><p>الأفق الأول في خارطة طريق افتراضية: الميزانية مناسبة، لكن المبادرات تحتاج 30 شهر عمل من مكتب البيانات، والمتاح 18. ما الحل الأصح؟</p><ul><li><b>أ.</b> أبقي المبادرات كما هي، فالفريق يستطيع العمل ساعات إضافية</li><li><b>ب.</b> أطلب ميزانية أكبر من الراعي لأن المال يحل المشكلة</li><li><b>ج.</b> أحذف المسؤول والمؤشر من بعض المبادرات لتخفيف العبء</li><li><b>د.</b> أنقل مبادرات لا تعتمد عليها غيرها إلى الأفق التالي</li></ul></li>
<li><p>مبادرة «تعيين ملاك البيانات للأصول الحرجة» في خارطة طريق جهة افتراضية. أي مؤشر يناسبها؟</p><ul><li><b>أ.</b> نسبة الأصول الحرجة التي لها مالك معيّن ونشط</li><li><b>ب.</b> عدد ورش التوعية بأهمية ملكية البيانات</li><li><b>ج.</b> رضا الإدارات عن خدمات مكتب البيانات في الاستبانة السنوية</li><li><b>د.</b> عدد السياسات المعتمدة في السنة</li></ul></li>
<li><p>لديك 15 دقيقة مع رئيس هيئة افتراضية. أي ترتيب للإحاطة أنسب؟</p><ul><li><b>أ.</b> الإجابة والقرارات المطلوبة، ثم الدرجات والخطة</li><li><b>ب.</b> المنهجية، ثم الأدلة بُعدًا بُعدًا، ثم الدرجات، ثم الخطة والتوصيات</li><li><b>ج.</b> الخطة أولًا، ثم الدرجات التي تبررها، ثم المنهجية</li><li><b>د.</b> شكر الفريق، ثم المنهجية، ثم الدرجات، ثم الأسئلة</li></ul></li>
<li><p>في الإحاطة يقول الرئيس: «مدير المشتريات يقول إن البيانات في المستوى 4، وأنتم تقولون 2». ما أفضل رد؟</p><ul><li><b>أ.</b> نعتذر، وسنراجع الدرجة مع مدير المشتريات بعد الاجتماع</li><li><b>ب.</b> الدرجة حكمنا المهني، ولا نناقش المنهجية في الإحاطة</li><li><b>ج.</b> نذكر الدليل الذي يحسم الدرجة والقاعدة، وما يرفعها إلى 3</li><li><b>د.</b> نقول إن المديرين يبالغون عادة في تقييم إداراتهم، وهذا معروف في التقييمات</li></ul></li>
<li><p>أي هذه الصياغات «قرار مطلوب» من الراعي، لا معلومة؟</p><ul><li><b>أ.</b> نسبة الطلبات المتأخرة 22% في الربع الأخير</li><li><b>ب.</b> سنبدأ بأسس البيانات قبل الذكاء الاصطناعي في خارطة الطريق</li><li><b>ج.</b> الحوكمة هي أضعف الأبعاد في الجهة كلها</li><li><b>د.</b> تكليف مديري الإدارات بتعيين ملاك البيانات خلال شهرين</li></ul></li>
